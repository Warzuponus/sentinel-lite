id: auth.password_spray
title: Password spray
severity: high
mitre: T1110.003
explanation: |
  One source IP trying the same (or few) passwords across many distinct
  usernames is a spray, not a brute force. Distinct-username count is the
  signal; a single-user flood should not fire this rule.
false_positives:
  - Identity-platform health checks that probe several test accounts
  - Misconfigured SSO broker retrying a user list after an outage
positive_fixture: tests/fixtures/ssh/password_spray.log
negative_fixture: tests/fixtures/ssh/brute_force_single_ip.log
