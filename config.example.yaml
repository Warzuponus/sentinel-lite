# Example analysis configuration for sentinel-lite.
# Copy to config.yaml and adjust thresholds for your lab fixtures.

version: 1

detectors:
  brute_force:
    enabled: true
    # Failed attempts from the same source IP within the window.
    fail_threshold: 5
    window_seconds: 300
    severity: high

  password_spray:
    enabled: true
    # Distinct usernames targeted by the same source IP within the window.
    user_threshold: 5
    window_seconds: 600
    severity: high

  success_after_fail:
    enabled: true
    # Failures preceding a success for the same username (optionally same IP).
    fail_threshold: 3
    window_seconds: 900
    require_same_ip: false
    severity: critical

output:
  # Finding fingerprint algorithm (do not change without updating tests).
  fingerprint_version: 1
